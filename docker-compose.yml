services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./.env:/var/www/html/.env
      - jasmin_logs:/var/log/jasmin:ro
    ports:
      - "8080:80"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbit-mq: {condition: service_healthy}
      jasmin: {condition: service_healthy}
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./.env:/var/www/html/.env
      - jasmin_logs:/var/log/jasmin:ro
    command: php artisan queue:work redis --queue=sms-submit,default --sleep=3 --tries=5 --timeout=45 --backoff=5
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbit-mq: {condition: service_healthy}
      jasmin: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smpp
      POSTGRES_USER: smpp
      POSTGRES_PASSWORD: smpp_secret
    volumes:
      - smpp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smpp -d smpp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - smpp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbit-mq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: jasmin
      RABBITMQ_DEFAULT_PASS: jasmin_secret
    volumes:
      - smpp_rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  jasmin:
    env_file: .env
    build:
      context: ./jasmin
      dockerfile: Dockerfile.compose
    environment:
      REDIS_CLIENT_HOST: redis
      REDIS_CLIENT_PORT: 6379
      AMQP_BROKER_HOST: rabbit-mq
      AMQP_BROKER_PORT: 5672
      AMQP_BROKER_USERNAME: jasmin
      AMQP_BROKER_PASSWORD: jasmin_secret
    volumes:
      - jasmin_config:/etc/jasmin
      - jasmin_store:/etc/jasmin/store
      - jasmin_logs:/var/log/jasmin
    ports:
      - "2775:2775"
      - "8990:8990"
      - "1401:1401"
    depends_on:
      redis: {condition: service_healthy}
      rabbit-mq: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 1401), 3); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  smpp_pg:
  smpp_redis:
  smpp_rabbitmq:
  jasmin_config:
  jasmin_store:
  jasmin_logs:
