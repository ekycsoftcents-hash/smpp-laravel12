services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./.env:/var/www/html/.env
    ports:
      - "8080:80"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbit-mq: {condition: service_healthy}
      gateway: {condition: service_healthy}
    restart: unless-stopped

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./.env:/var/www/html/.env
    command: php artisan queue:work redis --queue=sms-submit,default --sleep=1 --tries=8 --timeout=90 --max-jobs=1000 --max-time=3600
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbit-mq: {condition: service_healthy}
      gateway: {condition: service_healthy}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smpp
      POSTGRES_USER: smpp
      POSTGRES_PASSWORD: smpp_secret
    volumes:
      - smpp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smpp -d smpp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - smpp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbit-mq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: smpp
      RABBITMQ_DEFAULT_PASS: smpp_secret
    volumes:
      - smpp_rabbitmq:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://smpp:smpp_secret@postgres:5432/smpp
      REDIS_URL: redis://redis:6379
      GATEWAY_HTTP_PORT: 3001
      SMPP_CLIENT_BIND_HOST: 0.0.0.0
      SMPP_CLIENT_BIND_PORT: 2775
    ports:
      - "2775:2775"
      - "3001:3001"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  smpp_pg:
  smpp_redis:
  smpp_rabbitmq:
